[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-watch"
version = "1.0.0"
description = "Deterministic, evidence-grounded freight cost anomaly assistant"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
freight-watch = "freight_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
